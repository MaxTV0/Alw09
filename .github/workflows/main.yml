// worker.js - يتنشر على Cloudflare Workers
const ORIGIN = "https://real-source.com"; // ده مخفي في السيرفر

export default {
  async fetch(request) {
    const url = new URL(request.url);
    const path = url.pathname; // /hls/738894_3670.ts

    // ابني الرابط الحقيقي
    const realUrl = ORIGIN + path;

    // جيب الملف من المصدر الحقيقي
    const resp = await fetch(realUrl, {
      headers: {
        // انسخ بعض الهيدرز المهمة
        "User-Agent": request.headers.get("User-Agent") || "",
        "Referer": ORIGIN,
      },
    });

    // انسخ الاستجابة وعدّل الهيدرز
    const newHeaders = new Headers(resp.headers);
    newHeaders.set("Access-Control-Allow-Origin", "*");
    newHeaders.set("Access-Control-Allow-Methods", "GET, HEAD, OPTIONS");
    
    // ⚠️ لو الملف m3u8، بدّل الروابط جواه
    if (path.endsWith(".m3u8")) {
      const text = await resp.text();
      // استبدل كل رابط أصلي برابطك
      const cleaned = text
        .replaceAll(ORIGIN, url.origin)
        .replaceAll(/https?:\/\/[^\/]+\/hls\//g, url.origin + "/hls/");
      
      newHeaders.set("Content-Type", "application/vnd.apple.mpegurl");
      return new Response(cleaned, { headers: newHeaders });
    }

    // المقاطع TS تنقل زي ما هي
    if (path.endsWith(".ts")) {
      newHeaders.set("Content-Type", "video/mp2t");
    }

    return new Response(resp.body, { headers: newHeaders });
  }
};
