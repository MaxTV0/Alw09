name: Update HLS Playlist

on:
  schedule:
    - cron: '*/1 * * * *'   # كل دقيقة (الحد الأدنى لـ GitHub)
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Generate fresh playlist
        run: python generate_hls.py
      
      - name: Commit & push
        run: |
          git config user.name "hls-bot"
          git config user.email "bot@example.com"
          git add stream.m3u8
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "chore: refresh playlist [skip ci]"
          git push
